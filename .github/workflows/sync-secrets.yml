name: Sync secrets (GitHub to AWS)

# Copies the GitHub secret ENTSOE_API_KEY to SSM Parameter Store (SecureString, standard
# tier, free), where the live forecast task reads it (infra/compute.tf). Run by hand, once
# after the bootstrap of docs/aws.md and whenever the key changes. The key is never
# printed: it goes through a file readable only by the runner user, removed at once.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  entsoe-key:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
      - name: Write the ENTSO-E key to SSM
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          if [ -z "$ENTSOE_API_KEY" ]; then
            echo "::error::the secret ENTSOE_API_KEY is not set"
            exit 1
          fi
          umask 077
          file=$(mktemp)
          trap 'rm -f "$file"' EXIT
          printf '%s' "$ENTSOE_API_KEY" > "$file"
          aws ssm put-parameter --name /be-power-forecast/entsoe-api-key \
            --type SecureString --overwrite --value "file://$file" \
            --description "ENTSO-E Transparency Platform API key (from GitHub)" \
            --query Version --output text | sed 's/^/parameter version /'
