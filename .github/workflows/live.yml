name: Live forecast fallback (GitHub Actions)

# The daily live forecast runs on AWS (ECS Fargate, 17:30 and 20:30 UTC, docs/aws.md). This
# workflow is its fallback, run by hand when AWS cannot run it: the same image and the same
# script (scripts/aws_run.py), on GitHub's runner. It reads and writes the S3 state, the
# source of truth of the live forecasts (nothing is committed to the repository any more),
# publishes the page and refreshes the API, then checks that the forecast service of the
# image serves the forecasts it just wrote. A day already forecast is skipped. The ENTSO-E
# data stay in the private bucket. The Databricks copy is .github/workflows/sync-databricks.yml.
on:
  workflow_dispatch:
    inputs:
      day:
        description: "Delivery day YYYY-MM-DD (default: tomorrow, Brussels time)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: live-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
      - name: Build the image
        run: docker build -t be-power-forecast .
      - name: Forecast
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          DAY: ${{ inputs.day }}
        run: |
          mkdir -p work
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/work:/work" \
            -e BE_WORK_DIR=/work -e BE_DATA_BUCKET=${{ vars.DATA_BUCKET }} \
            -e BE_SITE_BUCKET=${{ vars.SITE_BUCKET }} -e BE_API_FUNCTION=be-power-forecast-api \
            -e ENTSOE_API_KEY -e GIT_COMMIT=${{ github.sha }} -e AWS_REGION \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
            be-power-forecast python scripts/aws_run.py ${DAY:+--day "$DAY"}
      - name: Check the forecast service
        # Serves the forecasts just written; when there is a forecast for tomorrow, the
        # service must return it (24 LEAR prices, and 24 DNN prices when the DNN ensemble
        # forecast it). No forecast (an input not published yet) is not a failure: the
        # page says so.
        run: |
          live=work/results/forecasts/live
          docker run -d --name service -p 8000:8000 -v "$PWD/$live:/live:ro" \
            -e BE_LIVE_PATH=/live/forecasts.csv -e BE_DNN_LIVE_PATH=/live/dnn_forecasts.csv \
            be-power-forecast
          for i in $(seq 30); do curl -sf localhost:8000/health && break; sleep 1; done
          day=$(TZ=Europe/Brussels date -d tomorrow +%Y-%m-%d)
          if grep -q "^$day," $live/forecasts.csv; then
            curl -sf -X POST localhost:8000/forecast -H "Content-Type: application/json" \
              -d "{\"delivery_day\": \"$day\"}" | tee answer.json
            python3 -c "import json; a = json.load(open('answer.json')); \
              assert a['model'] == 'lear_ensemble' and len(a['prices']) == 24, a"
            if grep -qs "^$day," $live/dnn_forecasts.csv; then
              python3 -c "import json; a = json.load(open('answer.json')); \
                assert len(a['dnn_prices'] or []) == 24, a"
            fi
          fi
          docker rm -f service
