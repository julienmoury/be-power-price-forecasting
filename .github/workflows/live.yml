name: Live forecast

# Every morning, before the 12:00 (Brussels) gate closure of the day-ahead auction:
# forecast tomorrow's Belgian prices and commit the forecast, the daily errors and the page
# live/README.md. Raw ENTSO-E data stay in the Actions cache, never in the repository.
on:
  schedule:
    - cron: "15 8 * * *" # 08:15 UTC = 09:15 CET / 10:15 CEST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore the ENTSO-E cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: entsoe-${{ github.run_id }}
          restore-keys: entsoe-
      - name: Install
        run: pip install -e .
      - name: Forecast
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python scripts/live_forecast.py
      - name: Commit the forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/forecasts/live live
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(live): forecast of $(date -u -d tomorrow +%Y-%m-%d)"
          git push
