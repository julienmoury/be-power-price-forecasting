[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "be-power-forecast"
version = "0.1.0"
description = "Day-ahead electricity price forecasting for Belgium: LEAR vs naive benchmarks, with robustness checks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Julien Moury" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
entsoe = ["entsoe-py>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Run under the original Python 3.8 environment, kept close to the original code.
extend-exclude = ["scripts/make_original_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running reproduction tests (deselect with -m 'not slow')"]
