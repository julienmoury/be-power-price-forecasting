name: Deploy (AWS)

# Infrastructure of infra/ and the image of the project, on AWS (docs/aws.md).
# * Pull request: terraform plan, shown in the run summary.
# * Push to main, or by hand: terraform apply (the registry first, so that the image can be
#   pushed), build and push the image tagged with the commit SHA, then terraform apply with
#   that tag, which registers the new Fargate task definition and updates the Lambda
#   function.
# Authentication: GitHub OIDC, role of infra/bootstrap/bootstrap.yaml; no AWS key is
# stored. Skipped until the repository variables of docs/aws.md are set.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_budget_email: ${{ vars.BUDGET_EMAIL }}
  TF_VAR_region: ${{ vars.AWS_REGION || 'eu-central-1' }}

jobs:
  plan:
    if: github.event_name == 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Init
        run: |
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"
      - name: Format and validate
        run: |
          terraform fmt -check -recursive
          terraform validate
      - name: Plan
        # The image of a pull request is not pushed: plan with the image deployed now.
        run: |
          tag=$(terraform output -raw image_tag 2>/dev/null || echo "${{ github.event.pull_request.base.sha }}")
          terraform plan -no-color -lock-timeout=5m -var "image_tag=$tag" -out=tfplan
          {
            echo "## terraform plan"
            echo
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name != 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Init
        run: |
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"
      - name: Format and validate
        run: |
          terraform fmt -check -recursive
          terraform validate
      - name: Apply the image registry
        # A no-op once it exists; on the first deployment, the image needs a registry.
        run: |
          terraform apply -auto-approve -lock-timeout=5m -var "image_tag=${{ github.sha }}" \
            -target=aws_ecr_repository.app -target=aws_ecr_lifecycle_policy.app
      - name: Build and push the image
        working-directory: .
        run: |
          registry=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          image="$registry/be-power-forecast:${{ github.sha }}"
          # Lambda runs Docker v2 manifests (no OCI index, no attestations).
          docker build --provenance=false -t "$image" .
          docker push "$image"
      - name: Apply
        run: terraform apply -auto-approve -lock-timeout=5m -var "image_tag=${{ github.sha }}"
      - name: Summary
        run: |
          {
            echo "## Deployed ${{ github.sha }}"
            echo
            echo "- Live page: $(terraform output -raw page_url)"
            echo "- API: $(terraform output -raw api_url)"
          } >> "$GITHUB_STEP_SUMMARY"
