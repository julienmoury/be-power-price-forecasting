name: Live forecast

# Every morning, before the 12:00 (Brussels) gate closure of the day-ahead auction:
# forecast tomorrow's Belgian prices and commit the forecast, the daily errors and the page
# live/README.md. Raw ENTSO-E data stay in the Actions cache, never in the repository.
on:
  schedule:
    - cron: "15 8 * * *" # 08:15 UTC = 09:15 CET / 10:15 CEST
  workflow_dispatch:
    inputs:
      backfill:
        description: "Optional: forecast FIRST LAST after the fact, labelled backtest (YYYY-MM-DD YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: live-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore the ENTSO-E cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: entsoe-${{ github.run_id }}
          restore-keys: entsoe-
      - name: Install
        run: pip install -e .
      - name: Forecast
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          if [ -n "$BACKFILL" ]; then
            read -r first last <<< "$BACKFILL"
            python scripts/live_forecast.py --backfill "$first" "$last"
          else
            python scripts/live_forecast.py
          fi
      - name: Commit the forecast
        env:
          BACKFILL: ${{ inputs.backfill }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/forecasts/live live
          if git diff --cached --quiet; then exit 0; fi
          if [ -n "$BACKFILL" ]; then msg="chore(live): backfill $BACKFILL";
          else msg="chore(live): forecast of $(date -u -d tomorrow +%Y-%m-%d)"; fi
          git commit -m "$msg"
          git push
